[package]
name = "sovermind"
version = "0.1.0"
description = "SoverMind premium report unlock — Solana devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sovermind"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl  = { version = "0.30.1", features = ["token"] }
